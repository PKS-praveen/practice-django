version: "3.9"

services:
  web:
    build: ./myproject
    container_name: web
    # Host networking: exposes Django directly on EC2's interface
    network_mode: host
    command: python manage.py runserver 0.0.0.0:9000
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./myproject/.env.web
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:15
    container_name: db
    restart: always
    ports:
      - "5435:5432"
    env_file:
      - ./myproject/.env.postgres
    networks:
      - mynet
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  app_logs:

networks:
  mynet:
    driver: bridge
